<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Marathon Tracker</title>
<style>
  :root {
    --bg: #0a0e14;
    --surface: #111720;
    --surface-2: #1a2230;
    --line: #232d3d;
    --text: #e8eef5;
    --muted: #7d8da3;
    --accent: #ff5e3a;       /* race orange */
    --accent-2: #34d399;     /* zone-2 green */
    --warn: #fbbf24;
    --easy: #38bdf8;
    --radius: 18px;
    --font-display: 'Archivo', system-ui, sans-serif;
    --font-body: 'Sora', system-ui, sans-serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Sora:wght@400;500;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: var(--font-body);
    background: radial-gradient(120% 80% at 50% 0%, #14202e 0%, var(--bg) 55%);
    color: var(--text);
    min-height: 100vh;
    padding: env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 540px; margin: 0 auto; padding: 0 16px; }
  header { padding: 22px 0 8px; display: flex; align-items: baseline; justify-content: space-between; }
  header h1 {
    font-family: var(--font-display); font-weight: 900;
    font-size: 1.45rem; letter-spacing: -0.02em; text-transform: uppercase;
  }
  header h1 span { color: var(--accent); }
  .countdown { font-size: .72rem; color: var(--muted); text-align: right; line-height: 1.3; }
  .countdown b { display: block; color: var(--text); font-size: 1.05rem; font-family: var(--font-display); }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
  }
  .card-title { font-size: .7rem; text-transform: uppercase; letter-spacing: .12em;
    color: var(--muted); margin-bottom: 12px; }

  /* Today hero */
  .today { position: relative; overflow: hidden; }
  .today::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,94,58,.14), transparent 60%);
    pointer-events: none;
  }
  .today .sess-type { font-size: .75rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--accent); font-weight: 600; }
  .today .sess-title { font-family: var(--font-display); font-weight: 800;
    font-size: 2.1rem; letter-spacing: -0.02em; margin: 4px 0 2px; }
  .today .sess-note { color: var(--muted); font-size: .92rem; }
  .today .metrics { display: flex; gap: 26px; margin-top: 16px; }
  .metric .v { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; }
  .metric .l { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }

  .pill { display:inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: .68rem; font-weight: 600; }
  .pill.bball { background: rgba(251,191,36,.14); color: var(--warn); }
  .pill.rest { background: var(--surface-2); color: var(--muted); }

  /* Week strip */
  .week { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; }
  .day { background: var(--surface-2); border-radius: 12px; padding: 9px 4px; text-align: center; }
  .day.today-cell { outline: 2px solid var(--accent); }
  .day .dn { font-size: .62rem; color: var(--muted); text-transform: uppercase; }
  .day .dk { font-family: var(--font-display); font-weight: 700; font-size: .95rem; margin-top: 3px; }
  .day .dt { font-size: .55rem; margin-top: 2px; }
  .t-easy { color: var(--easy); } .t-tempo { color: var(--accent); }
  .t-long { color: var(--accent-2); } .t-intervals { color: var(--warn); }
  .t-basketball { color: var(--warn); } .t-rest { color: var(--muted); }
  .t-race { color: var(--accent); } .t-recovery { color: var(--easy); }

  /* Runs */
  .run { display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--line); }
  .run:last-child { border-bottom: none; }
  .run .rl { font-weight: 500; font-size: .92rem; }
  .run .rd { font-size: .7rem; color: var(--muted); }
  .run .rr { text-align: right; }
  .run .rk { font-family: var(--font-display); font-weight: 700; }
  .run .hr { font-size: .7rem; }
  .hr.z2 { color: var(--accent-2); } .hr.over { color: var(--accent); }

  .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 14px;
    font-family: var(--font-body); font-weight: 600; font-size: .95rem; cursor: pointer; }
  .btn.primary { background: var(--accent); color: #14080a; }
  .btn.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
  .btn:active { transform: scale(.985); }

  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  input, select, textarea {
    width: 100%; background: var(--surface-2); border: 1px solid var(--line);
    color: var(--text); border-radius: 12px; padding: 12px; font-family: var(--font-body);
    font-size: .9rem; margin-bottom: 8px;
  }
  label { font-size: .7rem; color: var(--muted); display: block; margin-bottom: 4px; }

  .total { font-family: var(--font-display); font-weight: 800; font-size: 2rem; }
  .total small { font-size: .8rem; color: var(--muted); font-family: var(--font-body); }

  /* Tab bar */
  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(10,14,20,.92); backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
    display: flex; padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
    z-index: 50;
  }
  nav.tabs button { flex:1; background:none; border:none; color: var(--muted);
    font-family: var(--font-body); font-size: .64rem; cursor: pointer;
    display:flex; flex-direction:column; align-items:center; gap:4px; }
  nav.tabs button .ic { font-size: 1.2rem; }
  nav.tabs button.active { color: var(--accent); }

  .view { display: none; } .view.active { display: block; }
  .hide { display: none !important; }
  .empty { color: var(--muted); font-size: .88rem; text-align: center; padding: 20px 0; }
  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
    padding: 10px 18px; border-radius: 999px; font-size: .82rem; opacity: 0;
    transition: opacity .25s; pointer-events: none; z-index: 60; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Marathon<span>.</span></h1>
    <div class="countdown" id="countdown"><b>—</b>days to race</div>
  </header>

  <!-- TODAY -->
  <section class="view active" id="view-today">
    <div class="card today" id="todayCard">
      <div class="sess-type" id="sessType">Loading…</div>
      <div class="sess-title" id="sessTitle">—</div>
      <div class="sess-note" id="sessNote"></div>
      <div class="metrics" id="sessMetrics"></div>
    </div>

    <div class="card" id="stravaCard">
      <div class="card-title">Strava</div>
      <div id="stravaStatus" class="empty">Checking connection…</div>
      <a href="/auth/login" class="btn primary hide" id="connectBtn">Connect Strava</a>
      <button class="btn ghost hide" id="syncBtn">Sync recent runs</button>
    </div>

    <div class="card">
      <div class="card-title">This week · <span id="weekNo"></span></div>
      <div class="week" id="weekStrip"></div>
    </div>
  </section>

  <!-- RUNS -->
  <section class="view" id="view-runs">
    <div class="card">
      <div class="card-title">Total logged</div>
      <div class="total" id="totalKm">—<small> km</small></div>
    </div>
    <div class="card">
      <div class="card-title">Recent runs · Z2 ≤ <span id="z2hr"></span> bpm</div>
      <div id="runList" class="empty">No runs yet. Connect Strava and sync.</div>
    </div>
  </section>

  <!-- LIFTS -->
  <section class="view" id="view-lifts">
    <div class="card">
      <div class="card-title">Log a lift</div>
      <label>Split</label>
      <select id="lSplit"><option>Push</option><option>Pull</option><option>Legs</option></select>
      <label>Exercise</label>
      <input id="lExercise" placeholder="e.g. Back squat">
      <div class="row">
        <div><label>Weight (kg)</label><input id="lWeight" type="number" inputmode="decimal"></div>
        <div><label>Reps</label><input id="lReps" type="number" inputmode="numeric"></div>
        <div><label>Sets</label><input id="lSets" type="number" inputmode="numeric"></div>
      </div>
      <button class="btn primary" id="addLift">Add set</button>
    </div>
    <div class="card">
      <div class="card-title">Recent lifts</div>
      <div id="liftList" class="empty">Nothing logged yet.</div>
    </div>
  </section>

  <!-- BODY / INJURY -->
  <section class="view" id="view-body">
    <div class="card">
      <div class="card-title">Log a niggle</div>
      <label>Area</label>
      <input id="iArea" placeholder="e.g. Left calf">
      <label>Severity (1–5)</label>
      <select id="iSev"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
      <label>Note</label>
      <textarea id="iNote" rows="2" placeholder="Tightness during long run…"></textarea>
      <button class="btn primary" id="addInjury">Log it</button>
    </div>
    <div class="card">
      <div class="card-title">History</div>
      <div id="injuryList" class="empty">No niggles logged. Keep it that way.</div>
    </div>
  </section>
</div>

<nav class="tabs">
  <button data-view="today" class="active"><span class="ic">◎</span>Today</button>
  <button data-view="runs"><span class="ic">▦</span>Runs</button>
  <button data-view="lifts"><span class="ic">▤</span>Lifts</button>
  <button data-view="body"><span class="ic">✚</span>Body</button>
</nav>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const api = (u, o) => fetch(u, o).then(r => r.json());
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800); }

// Tabs
document.querySelectorAll('nav.tabs button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    b.classList.add('active');
    $('#view-'+b.dataset.view).classList.add('active');
  };
});

async function loadToday(){
  const d = await api('/api/today');
  $('#countdown').innerHTML = `<b>${d.days_to_race}</b>days to race`;
  const s = d.session;
  $('#sessType').textContent = s.type==='basketball' ? 'Basketball' :
                               s.type==='rest' ? 'Recovery' : s.type;
  $('#sessTitle').textContent = s.title;
  $('#sessNote').textContent = s.note || '';
  let m = '';
  if (s.km) m += `<div class="metric"><div class="v">${s.km}</div><div class="l">km</div></div>`;
  if (s.target_pace) m += `<div class="metric"><div class="v">${s.target_pace.replace('/km','')}</div><div class="l">pace</div></div>`;
  m += `<div class="metric"><div class="v">W${d.week}</div><div class="l">week</div></div>`;
  $('#sessMetrics').innerHTML = m;

  // Strava status
  if (d.strava_connected){
    $('#stravaStatus').textContent = 'Connected ✓';
    $('#connectBtn').classList.add('hide');
    $('#syncBtn').classList.remove('hide');
  } else {
    $('#stravaStatus').textContent = 'Not connected.';
    $('#connectBtn').classList.remove('hide');
    $('#syncBtn').classList.add('hide');
  }

  // Week strip
  const w = await api('/api/week');
  $('#weekNo').textContent = 'Week ' + w.week;
  const todayName = new Date().toLocaleDateString('en-US',{weekday:'short'});
  $('#weekStrip').innerHTML = w.days.map(day=>{
    const cell = day.day===todayName ? 'today-cell':'';
    return `<div class="day ${cell}">
      <div class="dn">${day.day}</div>
      <div class="dk t-${day.type}">${day.km||(day.type==='basketball'?'🏀':'—')}</div>
      <div class="dt t-${day.type}">${day.type.slice(0,4)}</div></div>`;
  }).join('');
}

async function loadRuns(){
  const d = await api('/api/runs');
  $('#z2hr').textContent = d.zone2_max_hr;
  $('#totalKm').innerHTML = `${d.total_km}<small> km</small>`;
  if (!d.runs.length){ return; }
  $('#runList').innerHTML = d.runs.map(r=>{
    const hr = r.avg_hr ? `<div class="hr ${r.in_zone2?'z2':'over'}">${Math.round(r.avg_hr)} bpm ${r.in_zone2?'· Z2':'· over'}</div>` : '';
    return `<div class="run">
      <div><div class="rl">${r.name||'Run'}</div><div class="rd">${r.date}</div></div>
      <div class="rr"><div class="rk">${r.distance_km} km</div>
      <div class="rd">${r.pace_str}</div>${hr}</div></div>`;
  }).join('');
}

async function loadLifts(){
  const d = await api('/api/lifts');
  if(!d.lifts.length){ $('#liftList').innerHTML='<div class="empty">Nothing logged yet.</div>'; return; }
  $('#liftList').innerHTML = d.lifts.map(l=>`
    <div class="run"><div><div class="rl">${l.exercise}</div>
    <div class="rd">${l.date} · ${l.split}</div></div>
    <div class="rr"><div class="rk">${l.weight_kg}kg</div>
    <div class="rd">${l.sets}×${l.reps} · vol ${l.volume}</div></div></div>`).join('');
}

async function loadInjuries(){
  const d = await api('/api/injuries');
  if(!d.injuries.length){ $('#injuryList').innerHTML='<div class="empty">No niggles logged. Keep it that way.</div>'; return; }
  $('#injuryList').innerHTML = d.injuries.map(i=>`
    <div class="run"><div><div class="rl">${i.area}</div>
    <div class="rd">${i.date} · ${i.note||''}</div></div>
    <div class="rr"><div class="rk">${i.severity}/5</div></div></div>`).join('');
}

$('#syncBtn').onclick = async ()=>{
  $('#syncBtn').textContent='Syncing…';
  const r = await api('/api/sync',{method:'POST'});
  $('#syncBtn').textContent='Sync recent runs';
  if(r.error){ toast('Sync failed'); return; }
  toast(`Synced ${r.synced} runs`); loadRuns();
};

$('#addLift').onclick = async ()=>{
  const fd = new FormData();
  fd.append('split',$('#lSplit').value);
  fd.append('exercise',$('#lExercise').value||'Lift');
  fd.append('weight_kg',$('#lWeight').value||0);
  fd.append('reps',$('#lReps').value||0);
  fd.append('sets',$('#lSets').value||0);
  await fetch('/api/lifts',{method:'POST',body:fd});
  $('#lExercise').value=$('#lWeight').value=$('#lReps').value=$('#lSets').value='';
  toast('Set added'); loadLifts();
};

$('#addInjury').onclick = async ()=>{
  const fd = new FormData();
  fd.append('area',$('#iArea').value||'—');
  fd.append('severity',$('#iSev').value);
  fd.append('note',$('#iNote').value);
  await fetch('/api/injuries',{method:'POST',body:fd});
  $('#iArea').value=$('#iNote').value='';
  toast('Logged'); loadInjuries();
};

// Init
loadToday(); loadRuns(); loadLifts(); loadInjuries();
if(location.search.includes('connected')) toast('Strava connected ✓');

// Register service worker for PWA
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/static/sw.js').catch(()=>{});
}
</script>
</body>
</html>
